services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: hardtrack_api
    user: "1000:1000"
    ports:
      - "8000:8000"
    volumes:
      - ./storage/tenants:/app/storage/tenants
    environment:
      - STORAGE_DIR=/app/storage/tenants
      - TELEGRAM_MOCK_MODE=true
      - HARDTRACK_SECRET_KEY=${HARDTRACK_SECRET_KEY:-dev-only-hardtrack-hmac-secret-change-in-production}
      - HARDTRACK_ADMIN_KEY=${HARDTRACK_ADMIN_KEY:-dev-only-hardtrack-admin-key}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-1200}
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: hardtrack_worker
    user: "1000:1000"
    volumes:
      - ./storage/tenants:/app/storage/tenants
    environment:
      - STORAGE_DIR=/app/storage/tenants
      - TELEGRAM_MOCK_MODE=true
      - WORKER_POLL_INTERVAL_SECONDS=60
    depends_on:
      - api
    restart: unless-stopped
