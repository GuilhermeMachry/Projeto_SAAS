name: CI Pipeline - Núcleo Multi-Tenant

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    name: Testes Automatizados e Isolamento de Tenancy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Suíte de Testes (Pytest)
        run: |
          pytest -v

      - name: Executar Demonstração de Isolamento ao Vivo (Checklist Etapa 2)
        run: |
          python scripts/demo_isolamento.py

      - name: Validação do Serviço da API (Healthcheck)
        run: |
          python -m uvicorn src.api.main:app --host 127.0.0.1 --port 8000 &
          PID=$!
          sleep 3
          curl --fail --retry 3 http://127.0.0.1:8000/health
          kill $PID
