name: CI Pipeline — Qualidade, Isolamento e Segurança (Etapa 3)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-security-gate:
    name: Testes (Unit, Integração, Contrato, Isolamento) & Segurança
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Testes Unitários e de Resiliência
        run: |
          pytest -v tests/test_unit_core.py tests/test_worker_resilience.py

      - name: 2. Testes de Integração da API e Contrato entre Serviços (API <-> Worker)
        run: |
          pytest -v tests/test_api_service.py tests/test_service_contract.py

      - name: 3. Testes Multi-Vetor de Isolamento de Tenant e Segurança (AuthZ / SSRF / CORS)
        run: |
          pytest -v tests/test_tenant_isolation.py tests/test_security_authz.py

      - name: 4. Auditoria Automatizada de Segurança (Secrets, CORS, AuthZ, Dependências)
        run: |
          python scripts/security_audit.py

      - name: 5. Demonstração Automatizada de Isolamento de Silos
        run: |
          python scripts/demo_isolamento.py

      - name: 6. Smoke Test ao Vivo da API (Healthcheck + AuthZ 401)
        run: |
          python -m uvicorn src.api.main:app --host 127.0.0.1 --port 8000 &
          PID=$!
          sleep 3
          curl --fail --retry 3 http://127.0.0.1:8000/health
          STATUS_NOAUTH=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/tenants/joao_b2c/targets)
          echo "HTTP sem token: $STATUS_NOAUTH"
          test "$STATUS_NOAUTH" -eq 401
          kill $PID
